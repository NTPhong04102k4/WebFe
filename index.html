<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Boxcars web application" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('soldcars-ui-preferences'));
          var theme = saved && saved.state && saved.state.theme ? saved.state.theme : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.resolvedTheme = isDark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', isDark);
        } catch (error) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'system';
            document.documentElement.dataset.resolvedTheme = 'dark';
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
    <title>Boxcars</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
